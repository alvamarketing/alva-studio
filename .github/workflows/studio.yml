name: Alva Studio Tests
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  studio-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/studio
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: 'pnpm'
          cache-dependency-path: packages/studio/pnpm-lock.yaml
      - name: Pre-pull postgres image
        run: docker pull postgres:alpine
      - name: Install dependencies
        run: pnpm --ignore-workspace install --frozen-lockfile
      - name: Run tests
        run: pnpm --ignore-workspace test
