<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Editor de landing · Alva Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/material-symbols.css">
  <link rel="stylesheet" href="/build/editor.css">
  <style>
    /* Só tokens de /tokens.css (o :root de styles.css): nenhuma cor, raio ou fonte nova aqui. */
    html, body, #editor { height: 100%; margin: 0; }
    body { font-family: var(--font-sans); color: var(--alva-ink); }
    .alva-item-da-biblioteca { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1px solid var(--alva-line); border-radius: var(--radius-lg); background: var(--alva-white); color: var(--alva-ink); font-size: var(--text-lg); cursor: grab; }
    .alva-item-da-biblioteca:hover { border-color: var(--alva-blue); }
    .alva-item-da-biblioteca svg:first-child { color: var(--alva-blue); flex: none; }
    .alva-item-da-biblioteca span { flex: 1; }
    .alva-item-da-biblioteca .alva-alca { color: var(--alva-muted); }
    .alva-recolhido { border: 1px solid var(--alva-line); border-radius: var(--radius-lg); padding: 10px 12px; }
    .alva-recolhido > summary { display: flex; align-items: center; gap: 8px; font-size: var(--text-lg); font-weight: 600; cursor: pointer; list-style: none; }
    .alva-recolhido > summary::-webkit-details-marker { display: none; }
    .alva-recolhido > summary::after { content: '+'; margin-left: auto; color: var(--alva-muted); }
    .alva-recolhido[open] > summary::after { content: '–'; }
    .alva-acao { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: var(--text-md); font-weight: 650; padding: 10px 14px; border: 1px solid var(--alva-line); border-radius: var(--radius-md); background: var(--alva-white); color: var(--alva-ink); cursor: pointer; }
    .alva-acao-icone { padding: 8px; order: -2; }
    .alva-acao:disabled { opacity: .6; cursor: progress; }
    .alva-acao-principal { background: var(--alva-blue); border-color: var(--alva-blue); color: var(--alva-on-blue); }
    .alva-acao-pendente { background: var(--alva-warning-bg); border-color: var(--alva-warning); color: var(--alva-warning); }
    .alva-acao:focus-visible, .alva-arvore-linha:focus-visible, .alva-botao-tracejado:focus-visible { outline: 2px solid var(--alva-blue); outline-offset: 2px; }
    .alva-topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 0 16px; background: var(--alva-white); border-bottom: 1px solid var(--alva-line); }
    .alva-topo-pagina { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .alva-topo-acoes { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .alva-marca { display: flex; align-items: center; gap: 9px; color: var(--alva-ink); text-decoration: none; flex: none; padding-right: 12px; margin-right: 4px; border-right: 1px solid var(--alva-line); }
    .alva-marca-simbolo { width: 17px; height: 24px; color: var(--alva-blue); }
    .alva-marca strong { font-size: var(--text-xl); font-weight: 700; letter-spacing: .16em; }
    .alva-marca span { color: var(--alva-muted); font-size: var(--text-lg); font-weight: 500; }
    .alva-voltar { order: 0; }
    .alva-topo-nome { margin: 0; font-size: var(--text-lg); font-weight: 700; color: var(--alva-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .alva-historico { display: flex; gap: 4px; }
    .alva-alca-menu { position: absolute; top: 0; display: inline-flex; align-items: center; justify-content: center; padding: 8px; border: 1px solid var(--alva-line); border-radius: var(--radius-md); background: var(--alva-white); color: var(--alva-muted); cursor: pointer; z-index: 2; }
    .alva-alca-menu:hover { color: var(--alva-ink); border-color: var(--alva-blue); }
    .alva-alca-menu[aria-pressed="true"] { color: var(--alva-blue); }
    .alva-alca-menu:focus-visible { outline: 2px solid var(--alva-blue); outline-offset: 2px; }
    .alva-alca-menu-esquerda { left: 12px; }
    .alva-alca-menu-direita { right: 12px; }
    [class*="PuckCanvas-controls"] { position: relative; min-height: 38px; }
    @media (max-width: 760px) {
      .alva-topo { flex-wrap: wrap; padding: 8px 12px; gap: 8px; }
      .alva-marca span { display: none; }
      /* No celular o Puck já tem as abas de baixo (Blocos, Estrutura, Propriedades): as alças sobram. */
      .alva-alca-menu { display: none; }
      .alva-topo-acoes { gap: 6px; }
      .alva-topo-acoes .alva-acao { padding: 8px 10px; font-size: var(--text-sm); }
      .alva-salvo { font-size: 0; gap: 0; margin-right: 0; }
    }
    .alva-menu { position: relative; }
    .alva-menu-painel { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; width: 320px; display: grid; gap: 10px; padding: 14px; background: var(--alva-white); border: 1px solid var(--alva-line); border-radius: var(--radius-lg); box-shadow: 0 16px 40px rgb(16 24 40 / 12%); font-size: var(--text-md); }
    .alva-menu-painel p, .alva-menu-painel small { margin: 0; color: var(--alva-muted); line-height: 1.5; }
    .alva-menu-painel label { display: grid; gap: 6px; color: var(--alva-muted); font-size: var(--text-sm); font-weight: 600; }
    .alva-menu-painel input { font: inherit; font-size: var(--text-md); font-weight: 400; color: var(--alva-ink); border: 1px solid var(--alva-line); border-radius: var(--radius-md); padding: 9px 10px; }
    .alva-salvo { display: inline-flex; align-items: center; gap: 5px; color: var(--alva-muted); font-size: var(--text-sm); margin-right: 6px; }
    .alva-salvo svg { color: var(--alva-success); }
    .alva-salvo-pendente svg { color: var(--alva-warning); }
    .alva-carregando, .alva-erro { padding: 32px; font-size: var(--text-lg); }
    .alva-erro { color: var(--alva-danger); }
    .alva-aviso { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 12px 18px; border-radius: var(--radius-lg); background: var(--alva-ink); color: var(--alva-white); font-size: var(--text-lg); z-index: 10; }
    .alva-estrutura { padding: 21px 14px; }
    .alva-estrutura h2 { font-size: var(--text-2xl); margin: 7px 0; }
    .alva-eyebrow { color: var(--alva-blue); font-size: var(--text-2xs); font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .alva-ajuda { color: var(--alva-muted); font-size: var(--text-sm); line-height: 1.5; margin: 0 0 20px; }
    .alva-arvore { display: grid; gap: 5px; }
    .alva-arvore-grupo { display: grid; gap: 5px; }
    .alva-arvore-linha { min-height: 38px; display: grid; grid-template-columns: 18px 22px 1fr auto; align-items: center; gap: 6px; padding: 5px 8px; border: 1px solid transparent; border-radius: var(--radius-md); color: var(--alva-ink); font-size: var(--text-sm); cursor: pointer; }
    .alva-arvore-linha:hover { background: var(--alva-cloud); }
    .alva-arvore-pai { font-weight: 700; margin-top: 7px; }
    .alva-arvore-ativa { background: var(--alva-highlight); border-color: var(--alva-blue-light); color: var(--alva-blue); }
    .alva-arvore-arrastando { opacity: .5; }
    .alva-arvore-alca { color: var(--alva-soft); cursor: grab; }
    .alva-arvore-nome { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .alva-arvore-linha small { color: var(--alva-soft); font-size: var(--text-2xs); }
    .alva-arvore-mais { position: relative; }
    .alva-botao-tracejado { margin: 5px 7px 10px; width: calc(100% - 14px); font: inherit; font-size: var(--text-md); font-weight: 650; padding: 10px 14px; border: 1px dashed var(--alva-blue-light); border-radius: var(--radius-md); background: var(--alva-white); color: var(--alva-blue); cursor: pointer; }
    .alva-arvore-menu { display: grid; gap: 2px; margin: 0 7px 10px; padding: 6px; background: var(--alva-white); border: 1px solid var(--alva-line); border-radius: var(--radius-md); }
    .alva-arvore-menu button { display: flex; align-items: center; gap: 8px; border: 0; background: var(--alva-white); border-radius: var(--radius-sm); padding: 9px; font: inherit; font-size: var(--text-sm); text-align: left; color: var(--alva-ink); cursor: pointer; }
    .alva-arvore-menu button:hover { background: var(--alva-highlight); color: var(--alva-blue); }
    .alva-arvore-menu svg { color: var(--alva-blue); }
  </style>
</head>
<body>
  <div id="editor"></div>
  <script type="module" src="/build/editor.js"></script>
</body>
</html>
