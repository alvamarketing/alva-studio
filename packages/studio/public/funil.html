<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Funil · Alva Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/build/funil.css">
  <style>
    /* Só tokens de /tokens.css (o :root de styles.css): nenhuma cor, raio ou fonte nova. */
    html, body, #funil { height: 100%; margin: 0; }
    body { font-family: var(--font-sans); color: var(--alva-ink); background: var(--alva-cloud); }
    button, input, select, textarea { font: inherit; color: inherit; }
    .fn-app { height: 100%; display: grid; grid-template-rows: 64px minmax(0, 1fr); }
    .fn-topo { display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--alva-line); background: var(--alva-white); }
    .fn-nome { flex: 0 1 360px; min-width: 0; font-size: var(--text-lg); font-weight: 700; border: 1px solid transparent; border-radius: var(--radius-md); padding: 8px 10px; background: transparent; }
    .fn-nome:hover, .fn-nome:focus { border-color: var(--alva-line); background: var(--alva-white); }
    .fn-salvo { display: inline-flex; align-items: center; gap: 5px; color: var(--alva-muted); font-size: var(--text-sm); margin-right: auto; }
    .fn-salvo svg { color: var(--alva-success); }
    .fn-pendente svg { color: var(--alva-warning); }
    .fn-acoes { display: flex; gap: 8px; align-items: center; }
    .fn-botao { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: var(--text-md); font-weight: 650; padding: 10px 14px; border: 1px solid var(--alva-line); border-radius: var(--radius-md); background: var(--alva-white); color: var(--alva-ink); cursor: pointer; text-decoration: none; white-space: nowrap; }
    .fn-botao:disabled { opacity: .5; cursor: default; }
    .fn-icone { padding: 8px; }
    .fn-principal { background: var(--alva-blue); border-color: var(--alva-blue); color: var(--alva-on-blue); }
    .fn-perigo { color: var(--alva-danger); }
    .fn-botao:focus-visible, .fn-item:focus-visible, .fn-etapa-acao:focus-visible { outline: 2px solid var(--alva-blue); outline-offset: 2px; }
    .fn-menu { position: relative; }
    .fn-menu-lista { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; width: 320px; display: grid; gap: 2px; padding: 10px; background: var(--alva-white); border: 1px solid var(--alva-line); border-radius: var(--radius-lg); box-shadow: 0 16px 40px rgb(16 24 40 / 12%); }
    .fn-menu-lista p { margin: 0 4px 6px; font-size: var(--text-sm); color: var(--alva-muted); line-height: 1.5; }
    .fn-menu-lista a { display: flex; justify-content: space-between; align-items: center; padding: 9px 8px; border-radius: var(--radius-sm); color: var(--alva-ink); text-decoration: none; font-size: var(--text-md); }
    .fn-menu-lista a:hover { background: var(--alva-highlight); color: var(--alva-blue); }
    .fn-corpo { min-height: 0; display: grid; grid-template-columns: 250px minmax(0, 1fr) 300px; }
    .fn-paleta, .fn-painel { overflow: auto; background: var(--alva-white); padding: 18px 14px; display: grid; gap: 10px; align-content: start; }
    .fn-paleta { border-right: 1px solid var(--alva-line); }
    .fn-painel { border-left: 1px solid var(--alva-line); }
    .fn-paleta h2, .fn-painel h2 { font-size: var(--text-2xl); margin: 0; }
    .fn-paleta h3 { font-size: var(--text-xs); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--alva-muted); margin: 10px 0 6px; }
    .fn-paleta section { display: grid; gap: 4px; }
    .fn-eyebrow { color: var(--alva-blue); font-size: var(--text-2xs); font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .fn-ajuda { margin: 0; color: var(--alva-muted); font-size: var(--text-sm); line-height: 1.5; }
    .fn-item { display: grid; grid-template-columns: 18px 1fr 14px; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid transparent; border-radius: var(--radius-md); background: none; text-align: left; font-size: var(--text-md); cursor: pointer; }
    .fn-item:hover { background: var(--alva-cloud); border-color: var(--alva-line); }
    .fn-item svg:first-child { color: var(--alva-blue); }
    .fn-item svg:last-child { color: var(--alva-soft); }
    .fn-campo { display: grid; gap: 6px; font-size: var(--text-sm); font-weight: 600; color: var(--alva-muted); }
    .fn-campo input, .fn-campo select, .fn-campo textarea { font-size: var(--text-md); font-weight: 400; color: var(--alva-ink); border: 1px solid var(--alva-line); border-radius: var(--radius-md); padding: 9px 10px; background: var(--alva-white); resize: vertical; }
    .fn-canvas { min-width: 0; min-height: 0; }
    .fn-etapa { width: 190px; display: grid; gap: 6px; padding: 10px 12px; border: 1px solid var(--alva-line); border-radius: var(--radius-lg); background: var(--alva-white); box-shadow: 0 6px 18px rgb(16 24 40 / 6%); font-size: var(--text-md); }
    .fn-etapa strong { font-size: var(--text-md); line-height: 1.35; }
    .fn-etapa-topo { display: flex; align-items: center; gap: 6px; color: var(--alva-muted); font-size: var(--text-xs); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .fn-pagina { border-color: var(--alva-blue-light); box-shadow: inset 0 3px 0 var(--alva-blue), 0 6px 18px rgb(16 24 40 / 6%); }
    .fn-pagina .fn-etapa-topo { color: var(--alva-blue); }
    .fn-resultado .fn-etapa-topo { color: var(--alva-positive); }
    .fn-selecionada { outline: 2px solid var(--alva-blue); outline-offset: 2px; }
    .fn-etapa-acao { display: inline-flex; align-items: center; gap: 5px; justify-self: start; padding: 5px 8px; border: 1px solid var(--alva-line); border-radius: var(--radius-sm); background: var(--alva-highlight); color: var(--alva-blue); font-size: var(--text-sm); font-weight: 650; text-decoration: none; cursor: pointer; }
    .fn-carregando, .fn-erro { padding: 32px; font-size: var(--text-lg); }
    .fn-erro { color: var(--alva-danger); }
    .fn-aviso { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 12px 18px; border-radius: var(--radius-lg); background: var(--alva-ink); color: var(--alva-white); font-size: var(--text-lg); z-index: 30; }
    @media (max-width: 900px) {
      .fn-app { grid-template-rows: auto minmax(0, 1fr); }
      .fn-topo { flex-wrap: wrap; padding: 10px 12px; }
      .fn-corpo { grid-template-columns: 1fr; grid-template-rows: auto 60vh auto; overflow: auto; }
      .fn-paleta { border-right: 0; border-bottom: 1px solid var(--alva-line); grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
      .fn-paleta section { grid-column: 1 / -1; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
      .fn-paleta section h3 { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <div id="funil"></div>
  <script type="module" src="/build/funil.js"></script>
</body>
</html>
