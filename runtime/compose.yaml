name: alva-studio

services:
  studio-web:
    build:
      context: ..
      dockerfile: runtime/Dockerfile.studio
    restart: unless-stopped
    environment:
      DATABASE_URL: ${STUDIO_DATABASE_URL:?Defina STUDIO_DATABASE_URL no ambiente do Coolify}
      HOST: 0.0.0.0
      PORT: 4178
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Defina PUBLIC_ORIGIN HTTPS no ambiente do Coolify}
      WEBHOOK_WORKER_ENABLED: "false"
      NVS_RUNTIME_ENABLED: ${NVS_RUNTIME_ENABLED:-false}
      TRACKING_MASTER_KEY: ${TRACKING_MASTER_KEY:?Defina TRACKING_MASTER_KEY no ambiente do Coolify}
      VERCEL_MASTER_KEY: ${VERCEL_MASTER_KEY:?Defina VERCEL_MASTER_KEY no ambiente do Coolify}
      PUBLICATION_RUNTIME_HMAC_SECRET: ${PUBLICATION_RUNTIME_HMAC_SECRET:-}
      PIXELS_ENABLED: ${PIXELS_ENABLED:-false}
      MEDIA_PIPELINE_ENABLED: "false"
      BILLING_ENFORCEMENT: ${BILLING_ENFORCEMENT:-false}
      ASAAS_ENVIRONMENT: ${ASAAS_ENVIRONMENT:-sandbox}
      ASAAS_SANDBOX_API_KEY: ${ASAAS_SANDBOX_API_KEY:-}
      ASAAS_SANDBOX_WEBHOOK_TOKEN: ${ASAAS_SANDBOX_WEBHOOK_TOKEN:-}
      ASAAS_PRODUCTION_API_KEY: ${ASAAS_PRODUCTION_API_KEY:-}
      ASAAS_PRODUCTION_WEBHOOK_TOKEN: ${ASAAS_PRODUCTION_WEBHOOK_TOKEN:-}
    depends_on:
      studio-postgres:
        condition: service_healthy
    ports:
      - 127.0.0.1:4178:4178
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4178/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  studio-worker:
    build:
      context: ..
      dockerfile: runtime/Dockerfile.studio
    restart: unless-stopped
    # Um processo, todos os papéis. Eram quatro containers rodando este mesmo arquivo com
    # --role diferente, e os blocos de cada papel nunca dependeram uns dos outros. O papel
    # 'media' saiu: não tinha bloco de trabalho, só migrava e batia heartbeat.
    command: ["node", "server/runtime-worker.mjs", "--role=webhook,tracking,billing"]
    environment:
      DATABASE_URL: ${STUDIO_DATABASE_URL:?Defina STUDIO_DATABASE_URL no ambiente do Coolify}
      WEBHOOK_WORKER_INTERVAL_MS: 5000
      ASAAS_ENVIRONMENT: ${ASAAS_ENVIRONMENT:-sandbox}
      ASAAS_SANDBOX_API_KEY: ${ASAAS_SANDBOX_API_KEY:-}
      ASAAS_PRODUCTION_API_KEY: ${ASAAS_PRODUCTION_API_KEY:-}
      TRACKING_PROVISION_ENABLED: ${TRACKING_PROVISION_ENABLED:-false}
      NVS_RUNTIME_ENABLED: ${NVS_RUNTIME_ENABLED:-false}
      TRACKING_MASTER_KEY: ${TRACKING_MASTER_KEY:?Defina TRACKING_MASTER_KEY no ambiente do Coolify}
    depends_on:
      studio-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "server/runtime-worker-healthcheck.mjs"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

  studio-postgres:
    image: postgres:16.6-alpine3.21@sha256:1d04b9ba1d4996401f2552b51beda8187f175c0645c091e4781134fc9c9a3eef
    restart: unless-stopped
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${STUDIO_POSTGRES_PASSWORD:?Defina STUDIO_POSTGRES_PASSWORD no ambiente do Coolify}
      POSTGRES_DB: studio
    volumes:
      - studio-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  studio-postgres-data:
