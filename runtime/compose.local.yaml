# Só para rodar na máquina, com OrbStack.
#
# O OrbStack dá a cada container um domínio e um certificado HTTPS em que o Mac já
# confia. Isso resolve sozinho a exigência do Studio — PUBLIC_ORIGIN em HTTPS e cookie
# de sessão Secure — sem proxy nenhum no meio e sem aviso de certificado no navegador.
#
# O endereço vira https://alva.orb.local e é o mesmo que o OrbStack mostra como link
# clicável no container studio-web.
services:
  studio-web:
    labels:
      dev.orbstack.domains: alva.orb.local
      dev.orbstack.http-port: "4178"
