versao: 2
produto: Alva Studio — criar, organizar e publicar landing pages, formulários e VSLs por projeto
stack:
  linguagem: JavaScript ESM
  framework: GrapesJS 0.23.6
  banco: PostgreSQL para a fundação SaaS; JSON local somente para compatibilidade e importação
  hospedagem: Painel Studio; publicação Vercel por projeto ainda pendente
  testes: node:test
  comando_teste: node --test packages/studio/test/*.test.mjs
  porque: O Studio preserva o editor sem CMS e passa a separar empresas, projetos e conteúdo de forma transacional.
nos:
  - id: fundacao_saas
    estado: feito
    faz: Isolar empresas, membros, projetos, páginas, formulários, sessões, versões, rotas e importação local no PostgreSQL
    depende: []
    produz: API SaaS com capacidades, isolamento por tenant, importador idempotente, migrações 001–005 e formulários públicos em /f/<empresa>/<projeto>/<formulario>
    passa_quando:
      tipo: comando
      comando: node --test --test-concurrency=1 packages/studio/test/*.test.mjs
      espera: exit 0 com 123 testes, incluindo isolamento entre duas empresas em leitura, escrita, exclusão, respostas, publicação e integrações pendentes
  - id: worker_webhook
    estado: pendente
    faz: Entregar webhooks em fila com resolução DNS, bloqueio de destinos privados e defesa contra DNS rebinding
    depende:
      - fundacao_saas
    produz: Egress assíncrono auditável, idempotente e seguro para submissões já persistidas
    passa_quando:
      tipo: homologação
      espera: Worker revalida o destino no momento da entrega, não acessa rede privada e registra cada tentativa sem expor respostas em logs.
  - id: shell_saas
    estado: feito
    faz: Aplicar Home, Empresa e Projeto do wireframe aos dados reais da fundação
    depende:
      - fundacao_saas
    produz: Navegação por empresa e projeto, contexto ativo e indicadores sem dados fictícios
    passa_quando:
      tipo: revisão
      espera: O painel mostra apenas dados autorizados da empresa e projeto ativos em desktop e celular.
  - id: editores_saas
    estado: pendente
    faz: Aplicar o shell compartilhado ao editor de landing pages e ao editor de formulários dinâmicos
    depende:
      - shell_saas
    produz: Árvore única de elementos, canvas e inspetor contextual com acessibilidade por teclado
    passa_quando:
      tipo: comando
      comando: node --test packages/studio/test/*.test.mjs
      espera: exit 0, com rotas e edições isoladas por projeto.
  - id: publicacao_por_projeto
    estado: pendente
    faz: Publicar snapshots atômicos de várias rotas em um projeto Vercel por projeto Studio
    depende:
      - editores_saas
    produz: Preview e produção separados, domínio por projeto, cofre de segredos e auditoria
    passa_quando:
      tipo: homologação
      espera: Vercel confirma READY para snapshot idempotente sem expor token ou misturar rotas.
  - id: midia_cdn
    estado: pendente
    faz: Armazenar vídeos e imagens por empresa e projeto com upload assinado, validação e entrega por CDN
    depende:
      - fundacao_saas
    produz: Biblioteca de mídia com assets isolados, processamento assíncrono e URLs públicas imutáveis por versão
    passa_quando:
      tipo: homologação
      espera: Upload inválido é rejeitado, mídia não cruza projetos e a publicação nunca depende de URL temporária ou blob local.
  - id: vsl_player
    estado: pendente
    faz: Criar player público de VSL com autoplay compatível, progresso, retomada, CTA temporizado e embed responsivo
    depende:
      - midia_cdn
      - shell_saas
    produz: Vídeos configuráveis com versões publicadas em /v/<publicId> e /embed/v/<publicId>, sem configurações sensíveis na URL
    passa_quando:
      tipo: homologação
      espera: O player publicado permanece estável durante edições, respeita acessibilidade e registra eventos deduplicados no projeto correto.
  - id: vsl_nos_editores
    estado: pendente
    faz: Reutilizar cada VSL como bloco nas landing pages e nas microlanding pages dos formulários dinâmicos
    depende:
      - editores_saas
      - vsl_player
    produz: Bloco de vídeo referenciado por ID, com prévia, CTA e validação de publicação
    passa_quando:
      tipo: homologação
      espera: A mesma VSL funciona nos dois editores e referências ausentes ou sem versão publicada impedem uma publicação quebrada.
  - id: tracking_analytics
    estado: pendente
    faz: Integrar Aurora, Umami e NVS por projeto e ambiente
    depende:
      - publicacao_por_projeto
      - worker_webhook
      - vsl_player
    produz: Pageviews, UTMs, mapa e conversão lead deduplicada após persistir a resposta
    passa_quando:
      tipo: homologação
      espera: Eventos não contêm respostas abertas ou dados pessoais e pertencem ao projeto correto.
  - id: agentes_mcp
    estado: pendente
    faz: Expor acesso Agent First por chave, escopo, projeto e auditoria
    depende:
      - fundacao_saas
    produz: MCP de leitura, rascunho e preview com chaves armazenadas apenas como hash
    passa_quando:
      tipo: homologação
      espera: Chave não cruza empresa/projeto e publicação em produção segue revisão e idempotência.
  - id: cobranca_empresa
    estado: pendente
    faz: Integrar assinatura empresarial ao Asaas e aplicar entitlements
    depende:
      - fundacao_saas
    produz: Checkout hospedado, webhook idempotente e limites por empresa
    passa_quando:
      tipo: homologação
      espera: Sandbox confirma cobrança, reconsulta do pagamento e atualização transacional antes de liberar recursos.
