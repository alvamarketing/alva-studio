versao: 2
produto: Alva Studio — criar, organizar e publicar landing pages, formulários e VSLs por projeto
stack:
  linguagem: JavaScript ESM
  framework: GrapesJS 0.23.6
  banco: PostgreSQL para a fundação SaaS; JSON local somente para compatibilidade e importação
  hospedagem: Painel Studio com publicação Vercel por projeto
  testes: node:test
  comando_teste: node --test packages/studio/test/*.test.mjs
  porque: O Studio preserva o editor sem CMS e passa a separar empresas, projetos e conteúdo de forma transacional.
nos:
  - id: fundacao_saas
    estado: feito
    faz: Isolar empresas, membros, projetos, páginas, formulários, sessões, versões, rotas e importação local no PostgreSQL
    depende: []
    produz: API SaaS com capacidades, isolamento por tenant, importador idempotente, migrações 001–005 e formulários públicos em /f/<empresa>/<projeto>/<formulario>
    passa_quando:
      tipo: comando
      comando: node --test --test-concurrency=1 packages/studio/test/*.test.mjs
      espera: exit 0 com 123 testes, incluindo isolamento entre duas empresas em leitura, escrita, exclusão, respostas, publicação e integrações pendentes
  - id: shell_saas
    estado: feito
    faz: Aplicar Home, Empresa e Projeto do wireframe aos dados reais da fundação
    depende:
      - fundacao_saas
    produz: Navegação por empresa e projeto, contexto ativo e indicadores sem dados fictícios
    passa_quando:
      tipo: revisão
      espera: O painel mostra apenas dados autorizados da empresa e projeto ativos em desktop e celular.
  - id: editores_saas
    estado: feito
    faz: Aplicar o shell compartilhado ao editor de landing pages e ao editor de formulários dinâmicos
    depende:
      - shell_saas
    produz: Árvore única de elementos, canvas e inspetor contextual com acessibilidade por teclado
    passa_quando:
      tipo: comando
      comando: node --test packages/studio/test/*.test.mjs
      espera: exit 0, com rotas e edições isoladas por projeto.
  - id: publicacao_por_projeto
    estado: feito
    faz: Publicar snapshots atômicos de várias rotas em um projeto Vercel por projeto Studio
    depende:
      - editores_saas
    produz: Preview e produção separados, domínio por projeto, cofre de segredos e auditoria
    passa_quando:
      tipo: homologação
      espera: Vercel confirma READY para snapshot idempotente sem expor token ou misturar rotas.
  - id: vsl_player
    estado: feito
    faz: Criar VSL por URL ou streaming pronto, com autoplay mutado, progresso, retomada, CTA temporizado e embed responsivo
    depende:
      - publicacao_por_projeto
    produz: Player configurável e publicável sem upload, transcodificação ou CDN próprios
    passa_quando:
      tipo: homologação
      espera: Uma URL de vídeo válida gera player acessível, CTA no tempo correto, retomada e embed funcional.
  - id: vsl_nos_editores
    estado: feito
    faz: Reutilizar cada VSL como bloco nas landing pages e nas microlanding pages dos formulários dinâmicos
    depende:
      - editores_saas
      - vsl_player
    produz: Bloco de vídeo referenciado por ID, com prévia, CTA e validação de publicação
    passa_quando:
      tipo: homologação
      espera: A mesma VSL funciona nos dois editores e referências ausentes ou sem versão publicada impedem uma publicação quebrada.
  - id: leads_integracoes
    estado: feito
    faz: Consolidar respostas no Studio, exportar CSV e entregar um webhook básico por formulário
    depende:
      - editores_saas
      - publicacao_por_projeto
    produz: Lista e exportação de leads por projeto, com envio simples para n8n, CRM ou URL configurada
    passa_quando:
      tipo: homologação
      espera: Resposta persistida aparece no Studio e no CSV; webhook HTTPS recebe o evento sem misturar projetos.
  - id: tracking_coletor
    estado: pendente
    faz: Coletar visitas, origem, UTMs e eventos de VSL e formulário em um coletor interno compatível com o modelo do Umami, sem cookie e sem dado pessoal
    depende:
      - leads_integracoes
      - vsl_player
    produz: Visualizações, origem, conversão por conteúdo e marcos 25/50/75/100 da VSL no projeto correto
    passa_quando:
      tipo: arquivo
      caminho: .estado/tracking_coletor.md
      casa: "Prova: coletor sem PII, isolado por projeto, [0-9]+ testes verdes"
  - id: tracking_pixels
    estado: pendente
    faz: Injetar pixels de mídia por projeto atrás de consentimento opt-in, com CSP de nonce por resposta e allowlist só dos provedores habilitados
    depende:
      - tracking_coletor
    produz: Meta, GA4, TikTok, LinkedIn e Taboola carregados apenas após consentimento registrado, sem pixel dentro do player de VSL
    passa_quando:
      tipo: arquivo
      caminho: .estado/tracking_pixels.md
      casa: "Prova: pixel só após consentimento, CSP com nonce e allowlist por projeto, [0-9]+ testes verdes"
  - id: tracking_conversoes
    estado: pendente
    faz: Enviar conversões server-side às plataformas com hashes SHA-256 de e-mail e telefone e click IDs, sem PII em claro e sem IP ou user agent
    depende:
      - tracking_pixels
    produz: Meta CAPI, Google Enhanced Conversions, TikTok Events API, LinkedIn CAPI e Taboola S2S deduplicados por tracking_event_id
    passa_quando:
      tipo: arquivo
      caminho: .estado/tracking_conversoes.md
      casa: "Prova: payload sem PII em claro, sem IP e sem user agent, deduplicado por tracking_event_id, [0-9]+ testes verdes"
  - id: cobranca_empresa
    estado: pendente
    faz: Integrar uma assinatura empresarial inicial ao Asaas e aplicar o acesso essencial
    depende:
      - tracking_coletor
    produz: Checkout hospedado, webhook idempotente e um plano comercial por empresa
    passa_quando:
      tipo: homologação
      espera: Sandbox confirma cobrança, reconsulta do pagamento e atualização transacional antes de liberar recursos.
  - id: agentes_mcp
    estado: pendente
    faz: Expor leitura e criação de rascunhos por agentes, mantendo publicação como ação humana
    depende:
      - cobranca_empresa
    produz: MCP por projeto com chaves em hash, leitura e rascunhos auditáveis
    passa_quando:
      tipo: homologação
      espera: Chave não cruza empresa/projeto e nenhum agente publica sem ação humana.
  - id: worker_webhook
    estado: feito
    faz: Evoluir o webhook básico para fila com tentativas, idempotência, auditoria e defesa contra DNS rebinding
    depende:
      - leads_integracoes
    produz: Entrega assíncrona robusta para volume e falhas temporárias
    passa_quando:
      tipo: homologação
      espera: Worker revalida o destino em cada tentativa, não acessa rede privada e não duplica entregas confirmadas.
  - id: midia_cdn
    estado: pendente
    faz: Adicionar upload próprio, processamento e CDN quando o uso de VSL justificar essa infraestrutura
    depende:
      - vsl_nos_editores
    produz: Biblioteca de mídia com upload assinado, transcodificação e entrega por CDN
    passa_quando:
      tipo: homologação
      espera: Mídia não cruza projetos e publicação nunca depende de URL temporária ou blob local.
