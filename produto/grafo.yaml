versao: 2
produto: Alva Studio — criar, organizar e publicar landing pages e quizzes por projeto
# V1: páginas, quizzes, analytics, tracking, cobrança e agentes. V2: mídia/VSL própria.
roadmap:
  v1: páginas, quizzes, analytics, tracking, cobrança e agentes
  v2: mídia e VSL própria com upload, R2, FFmpeg e HLS
stack:
  linguagem: JavaScript ESM
  framework: GrapesJS 0.23.6
  banco: PostgreSQL para a fundação SaaS; JSON local somente para compatibilidade e importação
  hospedagem: Painel Studio com publicação Vercel por projeto
  testes: node:test
  comando_teste: node --test packages/studio/test/*.test.mjs
  porque: O Studio preserva o editor sem CMS e passa a separar empresas, projetos e conteúdo de forma transacional.
nos:
  - id: fundacao_saas
    estado: feito
    faz: Isolar empresas, membros, projetos, páginas, formulários, sessões, versões, rotas e importação local no PostgreSQL
    depende: []
    produz: API SaaS com capacidades, isolamento por tenant, importador idempotente, migrações 001–005 e formulários públicos em /f/<empresa>/<projeto>/<formulario>
    passa_quando:
      tipo: comando
      comando: node --test --test-concurrency=1 packages/studio/test/*.test.mjs
      espera: exit 0 com 123 testes, incluindo isolamento entre duas empresas em leitura, escrita, exclusão, respostas, publicação e integrações pendentes
  - id: shell_saas
    estado: feito
    faz: Aplicar Home, Empresa e Projeto do wireframe aos dados reais da fundação
    depende:
      - fundacao_saas
    produz: Navegação por empresa e projeto, contexto ativo e indicadores sem dados fictícios
    passa_quando:
      tipo: arquivo
      caminho: .estado/shell_saas.md
      casa: "Resultado: [0-9]+ testes aprovados, 0 falhas"
  - id: editores_saas
    estado: feito
    faz: Aplicar o shell compartilhado ao editor de landing pages e ao editor de formulários dinâmicos
    depende:
      - shell_saas
    produz: Árvore única de elementos, canvas e inspetor contextual com acessibilidade por teclado
    passa_quando:
      tipo: comando
      comando: node --test packages/studio/test/*.test.mjs
      espera: exit 0, com rotas e edições isoladas por projeto.
  - id: publicacao_por_projeto
    estado: feito
    faz: Publicar snapshots atômicos de várias rotas em um projeto Vercel por projeto Studio
    depende:
      - editores_saas
    produz: Preview e produção separados, domínio por projeto, cofre de segredos e auditoria
    passa_quando:
      tipo: arquivo
      caminho: .estado/publicacao_por_projeto.md
      casa: "Suíte final: [0-9]+ testes aprovados, 0 falhas"
  - id: vsl_player
    fase: v2
    estado: feito
    faz: Criar VSL por URL ou streaming pronto, com autoplay mutado, progresso, retomada, CTA temporizado e embed responsivo
    depende:
      - publicacao_por_projeto
    produz: Player configurável e publicável sem upload, transcodificação ou CDN próprios
    passa_quando:
      tipo: arquivo
      caminho: .estado/vsl_player.md
      casa: "Suíte final: [0-9]+ testes aprovados, 0 falhas"
  - id: vsl_nos_editores
    fase: v2
    estado: feito
    faz: Reutilizar cada VSL como bloco nas landing pages e nas microlanding pages dos formulários dinâmicos
    depende:
      - editores_saas
      - vsl_player
    produz: Bloco de vídeo referenciado por ID, com prévia, CTA e validação de publicação
    passa_quando:
      tipo: arquivo
      caminho: .estado/vsl_nos_editores.md
      casa: "[0-9]+ testes aprovados e 0 falhas"
  - id: leads_integracoes
    estado: feito
    faz: Consolidar respostas no Studio, exportar CSV e entregar um webhook básico por formulário
    depende:
      - editores_saas
      - publicacao_por_projeto
    produz: Lista e exportação de leads por projeto, com envio simples para n8n, CRM ou URL configurada
    passa_quando:
      tipo: arquivo
      caminho: .estado/leads_integracoes.md
      casa: "[0-9]+ pass, 0 fail"
  - id: tracking_coletor
    estado: feito
    faz: Manter o coletor Node legado registrando visitas, origem, UTMs e eventos de VSL e formulário até o corte, sem se declarar Umami real
    depende:
      - leads_integracoes
    produz: Coleta legada isolada por projeto até o corte e compatibilidade de leitura por 90 dias após o corte
    passa_quando:
      tipo: arquivo
      caminho: .estado/tracking_coletor.md
      casa: "Prova: coletor sem PII, isolado por projeto, [0-9]+ testes verdes"
  - id: runtime_comercial
    estado: pendente
    faz: Executar Studio, Umami e NVS Core como motores internos isolados, sem painel ou credencial administrativa pública
    depende:
      - tracking_coletor
    produz: Runtime reproduzível com bancos separados, workers e health checks privados
    passa_quando:
      tipo: arquivo
      caminho: .estado/runtime_comercial.md
      casa: "Prova: runtime interno reproduzível, [0-9]+ testes verdes"
  - id: provisionamento_motores
    estado: pendente
    faz: Provisionar de forma idempotente um website Umami e uma propriedade NVS para cada projeto e ambiente
    depende:
      - runtime_comercial
    produz: Bindings isolados por projeto e ambiente, com retry, backoff e sem IDs remotos no navegador
    passa_quando:
      tipo: arquivo
      caminho: .estado/provisionamento_motores.md
      casa: "Prova: provisionamento idempotente e isolado, [0-9]+ testes verdes"
  - id: integracao_motores
    estado: pendente
    faz: Integrar publicação, analytics, lead e conversão aos motores provisionados sem dupla escrita no coletor histórico
    depende:
      - provisionamento_motores
    produz: Pageviews no Umami e eventos comerciais deduplicados no NVS, apresentados apenas pelo Studio
    passa_quando:
      tipo: arquivo
      caminho: .estado/integracao_motores.md
      casa: "Prova: eventos reais sem IDs administrativos expostos, [0-9]+ testes verdes"
  - id: homologacao_motores
    estado: pendente
    faz: Homologar os motores reais em containers com dois tenants, retry, isolamento e transição do histórico
    depende:
      - integracao_motores
    produz: Corte validado, histórico Node em leitura por 90 dias e evidências de serviços reais
    passa_quando:
      tipo: arquivo
      caminho: .estado/homologacao_motores.md
      casa: "Prova: homologação real concluída, [0-9]+ testes verdes"
  - id: tracking_pixels
    fase: v1
    estado: pendente
    faz: Injetar pixels de mídia por projeto atrás de consentimento opt-in, com CSP de nonce por resposta e allowlist só dos provedores habilitados
    depende:
      - homologacao_motores
    produz: Meta, GA4, TikTok, LinkedIn e Taboola carregados apenas após consentimento registrado, sem pixel dentro do player de VSL
    passa_quando:
      tipo: arquivo
      caminho: .estado/tracking_pixels.md
      casa: "Prova: pixel só após consentimento, CSP com nonce e allowlist por projeto, [0-9]+ testes verdes"
  - id: tracking_conversoes
    fase: v1
    estado: pendente
    faz: Enviar conversões server-side às plataformas com hashes SHA-256 de e-mail e telefone e click IDs, sem PII em claro e sem IP ou user agent
    depende:
      - tracking_pixels
    produz: Meta CAPI, Google Enhanced Conversions, TikTok Events API, LinkedIn CAPI e Taboola S2S deduplicados por tracking_event_id
    passa_quando:
      tipo: arquivo
      caminho: .estado/tracking_conversoes.md
      casa: "Prova: payload sem PII em claro, sem IP e sem user agent, deduplicado por tracking_event_id, [0-9]+ testes verdes"
  - id: cobranca_empresa
    fase: v1
    estado: pendente
    faz: Integrar uma assinatura empresarial inicial ao Asaas e aplicar o acesso essencial
    depende:
      - homologacao_motores
    produz: Checkout hospedado, webhook idempotente e um plano comercial por empresa
    passa_quando:
      tipo: arquivo
      caminho: .estado/cobranca_empresa.md
      casa: "Prova: cobrança sandbox confirmada, webhook idempotente, [0-9]+ testes verdes"
  - id: agentes_mcp
    fase: v1
    estado: pendente
    faz: Expor leitura e criação de rascunhos por agentes, mantendo publicação como ação humana
    depende:
      - cobranca_empresa
    produz: MCP por projeto com chaves em hash, leitura e rascunhos auditáveis
    passa_quando:
      tipo: arquivo
      caminho: .estado/agentes_mcp.md
      casa: "Prova: chave em hash por projeto, nenhum agente publica sem ação humana, [0-9]+ testes verdes"
  - id: worker_webhook
    estado: feito
    faz: Evoluir o webhook básico para fila com tentativas, idempotência, auditoria e defesa contra DNS rebinding
    depende:
      - leads_integracoes
    produz: Entrega assíncrona robusta para volume e falhas temporárias
    passa_quando:
      tipo: arquivo
      caminho: .estado/worker_webhook.md
      casa: "Suíte completa rodada localmente: [0-9]+/[0-9]+"
  - id: midia_cdn
    fase: v2
    estado: pendente
    faz: Adicionar upload próprio, processamento e CDN quando o uso de VSL justificar essa infraestrutura
    depende:
      - vsl_nos_editores
      - runtime_comercial
    produz: Biblioteca de mídia com upload assinado, transcodificação e entrega por CDN
    passa_quando:
      tipo: arquivo
      caminho: .estado/midia_cdn.md
      casa: "Prova: mídia isolada por empresa e projeto, publicação sem URL temporária, [0-9]+ testes verdes"
